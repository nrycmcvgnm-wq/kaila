<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sistem Bilangan</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf2f8;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #aaa;
        }

        h2 {
            color: #154360;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background: #2471a3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #154360;
        }

        #hasil {
            text-align: left;
            background: #f4f6f7;
            padding: 12px;
            margin-top: 15px;
            border-radius: 5px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Kalkulator Sistem Bilangan</h2>

    <p>Masukkan angka yang ingin dikonversi.</p>

    <input type="text" id="angka"
           placeholder="Masukkan angka, contoh: 1010">

    <label for="asal">Sistem bilangan asal:</label>
    <select id="asal">
        <option value="2">Biner (Basis 2)</option>
        <option value="8">Oktal (Basis 8)</option>
        <option value="10" selected>Desimal (Basis 10)</option>
        <option value="16">Heksadesimal (Basis 16)</option>
    </select>

    <button onclick="konversi()">Konversi Bilangan</button>

    <div id="hasil">
        <b>Hasil konversi akan muncul di sini.</b>
    </div>

</div>

<script>
function konversi() {
    const angka = document.getElementById("angka")
        .value.trim();

    const asal = Number(
        document.getElementById("asal").value
    );

    const hasil = document.getElementById("hasil");

    if (!angka) {
        hasil.innerHTML = "Silakan masukkan angka terlebih dahulu.";
        return;
    }

    const digitValid = {
        2: /^[01]+$/,
        8: /^[0-7]+$/,
        10: /^[0-9]+$/,
        16: /^[0-9a-fA-F]+$/
    };

    if (!digitValid[asal].test(angka)) {
        hasil.innerHTML =
            "Angka tidak valid untuk sistem bilangan yang dipilih.";
        return;
    }

    const nilai = parseInt(angka, asal);

    if (!Number.isSafeInteger(nilai)) {
        hasil.innerHTML =
            "Angka terlalu besar untuk dikonversi dengan tepat.";
        return;
    }

    hasil.innerHTML = `
        <h3>Hasil Konversi</h3>
        <p>Biner (Basis 2): <b>${nilai.toString(2)}</b></p>
        <p>Oktal (Basis 8): <b>${nilai.toString(8)}</b></p>
        <p>Desimal (Basis 10): <b>${nilai.toString(10)}</b></p>
        <p>Heksadesimal (Basis 16): <b>${nilai.toString(16).toUpperCase()}</b></p>
    `;
}
</script>

</body>
</html>
